<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="POST">
   {% csrf_token %}
    <div align="center">
        <h1>Login Page</h1>
        <div style="height: 30px;">
            <h3><font color="green">{{ form.message }}</font></h3>
        </div>
        <table>
            <tr>
                <th>Login ID:</th>
                <td><input type="text" name="loginId"></td>
                <td style="position: fixed;"><font color="red">{{ form.input_error.login_id }}</font></td>
            </tr>
            <tr>
                <th>Password:</th>
                <td><input type="password" name="password"></td>
                <td style="position: fixed;"><font color="red">{{ form.input_error.password }}</font></td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" value="signIn"></td>
            </tr>
        </table>
    </div>
</form>
</body>
</html>
